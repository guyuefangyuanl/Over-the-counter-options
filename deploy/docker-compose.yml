version: '3.8'

services:
  flask-app:
    build: 
      context: ..
      dockerfile: Dockerfile
    container_name: option-flask-app
    restart: always
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - FLASK_PORT=5002
      - TZ=Asia/Shanghai
    volumes:
      - ../logs:/app/logs
      - ../.env.production:/app/.env.production
    networks:
      - option-network

  nginx:
    image: nginx:alpine
    container_name: option-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../admin-ui/dist:/var/www/admin-ui
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - flask-app
    networks:
      - option-network

networks:
  option-network:
    driver: bridge
